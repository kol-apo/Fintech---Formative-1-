---
- name: Configure Server and Deploy MoMoSim
  hosts: momosim
  become: true

  vars:
    app_dir: "/opt/momosim"

  tasks:
    - name: Install required system packages
      apt:
        name:
          - apt-transport-https
          - ca-certificates
          - curl
          - awscli
        state: present
        update_cache: yes

    - name: Install Docker
      apt:
        name:
          - docker.io
          - docker-compose-v2
        state: present

    - name: Start and enable Docker service
      service:
        name: docker
        state: started
        enabled: yes

    - name: Ensure app directory exists
      file:
        path: "{{ app_dir }}"
        state: directory

    - name: Render production docker-compose.yml
      template:
        src: templates/docker-compose.yml.j2
        dest: "{{ app_dir }}/docker-compose.yml"

    # No stored registry password: the instance's IAM role (scoped to pull
    # from exactly this one ECR repository) supplies the credentials behind
    # the scenes via the instance metadata service.
    - name: Log in to ECR
      shell: >
        aws ecr get-login-password --region {{ aws_region }}
        | docker login --username AWS --password-stdin {{ ecr_repository_url }}
      changed_when: false

    - name: Pull the latest image
      command: docker compose pull
      args:
        chdir: "{{ app_dir }}"

    - name: Restart the service with the new image
      command: docker compose up -d --remove-orphans
      args:
        chdir: "{{ app_dir }}"

    - name: UFW - Allow port 22 (SSH)
      ufw:
        rule: allow
        port: '22'
        proto: tcp

    - name: UFW - Allow port 3000 (App)
      ufw:
        rule: allow
        port: '3000'
        proto: tcp

    - name: UFW - Enable firewall with default deny
      ufw:
        state: enabled
        policy: deny

    - name: Hardening - Disable root login
      lineinfile:
        path: /etc/ssh/sshd_config
        regexp: '^#?PermitRootLogin'
        line: 'PermitRootLogin no'
      notify: Restart SSH

    - name: Hardening - Disable password authentication
      lineinfile:
        path: /etc/ssh/sshd_config
        regexp: '^#?PasswordAuthentication'
        line: 'PasswordAuthentication no'
      notify: Restart SSH

  handlers:
    - name: Restart SSH
      service:
        name: ssh
        state: restarted