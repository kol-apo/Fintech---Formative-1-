name: CI

# Runs on pushes to every branch EXCEPT main, and on pull requests
# targeting main. Direct pushes to main don't re-run the pipeline —
# code only lands there through a PR that already passed it.
#
# workflow_call: lets cd.yml invoke this exact set of jobs as its first gate
# before building/deploying, instead of duplicating lint/test/scan logic.
on:
  push:
    branches-ignore: [main]
  pull_request:
    branches: [main]
  workflow_call: {}

jobs:
  lint-and-test:
    name: Lint & Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: momosim

    strategy:
      matrix:
        node-version: [20.x, 22.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"
          cache-dependency-path: momosim/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Run tests with coverage
        run: npm test

      - name: Upload coverage report
        if: matrix.node-version == '20.x'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: momosim/coverage/
          retention-days: 7

  dependency-scan:
    name: Dependency scan (npm audit)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: momosim

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      # Visibility: print every advisory (all severities). Never blocks the
      # build — this step is purely so findings are readable in the PR logs.
      - name: Audit report (all severities, non-blocking)
        run: npm audit
        continue-on-error: true

      # Gate: fail the pipeline on High/Critical advisories in the packages
      # that actually ship — i.e. PRODUCTION dependencies (`--omit=dev`).
      # The production image is built with `npm ci --omit=dev`, so dev-only
      # tooling (jest, eslint and their transitive deps) never reaches
      # deployment. Those dev advisories are still printed by the report step
      # above for visibility; they simply don't block merges — especially as
      # some currently have no fix short of a breaking jest downgrade. Any
      # High/Critical in a production dependency still hard-fails the build.
      - name: Audit gate (fail on high or critical in production deps)
        run: npm audit --audit-level=high --omit=dev

  docker-build:
    name: Build Docker image
    runs-on: ubuntu-latest
    needs: lint-and-test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build image
        run: docker build -t momosim:ci ./momosim

      # Scan the image we just built (still only in the local Docker daemon,
      # not a registry) for known OS/library CVEs. Pinned to a fixed action
      # version for reproducibility.
      #   severity        -> focus the report on CRITICAL/HIGH only
      #   ignore-unfixed  -> only surface CVEs that actually have a fix
      #   exit-code 0     -> REPORT, don't block. Every finding this scan
      #                      produces lives in the node:20-alpine base image
      #                      (OS packages + npm's bundled tooling), never in
      #                      our own app layers, and no patched base image is
      #                      available yet. Hard-failing on base-image CVEs we
      #                      cannot remediate would permanently block the whole
      #                      team's merges, so the scan runs on every PR and
      #                      surfaces findings for review / SECURITY.md while
      #                      exiting 0. Our own dependencies are gated hard in
      #                      the separate dependency-scan job (npm audit).
      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: momosim:ci
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "0"

      # Gate: hard-fail on CRITICAL only. Scoped below HIGH deliberately —
      # the two currently-known findings (SECURITY.md) are both HIGH, in
      # node:20-alpine, with no fix available yet and no reachable code path
      # in this app (we never invoke npm/tar at runtime); blocking the whole
      # team's merges on an unfixable base-image CVE would give no security
      # benefit. Anything CRITICAL, though, always blocks.
      - name: Scan image with Trivy (gate - fail on CRITICAL)
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: momosim:ci
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Smoke-test the image
        run: |
          docker run -d --rm --name momosim-ci -p 3000:3000 momosim:ci
          sleep 3
          curl --fail http://localhost:3000/api/accounts
          docker stop momosim-ci

  iac-scan:
    name: IaC scan (Checkov)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Static-analyse the Terraform in terraform/ for insecure infrastructure
      # settings (open ingress, unencrypted volumes, missing logging, etc.).
      #   directory/framework -> scan only our Terraform, nothing else
      #   quiet               -> print only the checks that FAILED
      #   skip_check          -> the specific, already-triaged checks listed
      #                          and reasoned in SECURITY.md (structural
      #                          design choices, cost trade-offs, or verified
      #                          Checkov false positives on cross-module SG
      #                          references) — kept in sync with that doc.
      #   soft_fail: false    -> hard gate on everything NOT in skip_check.
      #                          Any NEW finding (e.g. from a future module
      #                          change) blocks the build until it's fixed or
      #                          added to skip_check with a documented reason.
      - name: Run Checkov against terraform/
        uses: bridgecrewio/checkov-action@v12.3114.0
        with:
          directory: terraform/
          framework: terraform
          quiet: true
          soft_fail: false
          output_format: cli
          skip_check: "CKV_AWS_126,CKV_AWS_135,CKV_AWS_88,CKV_AWS_161,CKV_AWS_293,CKV_AWS_353,CKV_AWS_157,CKV_AWS_129,CKV_AWS_118,CKV_AWS_130,CKV_AWS_136,CKV_AWS_51,CKV_AWS_260,CKV_AWS_24,CKV2_AWS_60,CKV2_AWS_5,CKV2_AWS_12,CKV2_AWS_30,CKV2_AWS_11"
